[project]
name = "ru-ai-channels"
version = "0.1.0"
description = "Каталог русскоязычных Telegram-каналов про Claude Code, вайбкодинг и ИИ-агентов с автообновлением числа подписчиков"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx[socks]>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ru_ai_channels"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# Проект русскоязычный: кириллица в строках и комментариях не «подозрительные символы»
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
ru-ai-channels = "ru_ai_channels.cli:main"
